<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Class Clash · 첨부 챔피언 동작 검수</title>
<style>body{margin:0;padding:24px;background:#12242a;color:#e8ead7;font:14px system-ui}header{display:flex;gap:20px;align-items:center;flex-wrap:wrap}h1{font-size:24px}a{color:#eacb87}select,button{font:inherit;background:#29413e;color:white;padding:10px;border:1px solid #819178;border-radius:6px}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin-top:24px}article{background:#20362f;border:1px solid #426055;border-radius:8px;padding:12px;text-align:center}canvas{display:block;margin:auto;image-rendering:pixelated;background:radial-gradient(ellipse at 50% 80%,#49614b,#20362f 65%)}p{color:#a8bcab;font-size:12px;line-height:1.7}small{display:block;color:#c4b791}</style>
<header><h1>18종 챔피언 · 원본 애니메이션</h1><a href="/">게임으로</a><label>동작 <select id="clip"><option value="idle">대기</option><option value="run">이동</option><option value="attack">기본 공격</option><option value="skill1">스킬 1</option><option value="skill2">스킬 2</option><option value="hit">피격</option><option value="dead">사망</option></select></label><button id="pause">일시정지</button></header>
<p>사용자가 첨부한 패키지의 원본 PNG와 프레임 시간을 재생합니다. 실제 경기는 서버의 공격·스킬 적중 시각에 맞추어 재생 속도를 조절합니다. 클래스 클래시의 18종 역할·성장·두 스킬은 유지하며 외형을 적용했습니다. 일부 원본의 피격·대기는 단일 프레임입니다.</p><main id="grid"></main>
<script type="module">
const catalog=await(await fetch('/assets/champions/manifest.json')).json(),grid=document.querySelector('#grid'),views=[];
for(const [id,s]of Object.entries(catalog)){const article=document.createElement('article'),title=document.createElement('h3'),canvas=document.createElement('canvas'),label=document.createElement('small'),credit=document.createElement('p');title.textContent=s.name;canvas.width=200;canvas.height=160;credit.textContent=`${id} · ${s.author}`;article.append(title,canvas,label,credit);grid.append(article);const image=new Image();image.src=s.sheet;await image.decode();views.push({s,image,c:canvas.getContext('2d'),label});}
let stopped=false,last=performance.now(),elapsed=0;document.querySelector('#pause').onclick=event=>{stopped=!stopped;event.target.textContent=stopped?'재생':'일시정지';};document.querySelector('#clip').onchange=()=>elapsed=0;
function draw(now){if(!stopped)elapsed+=now-last;last=now;for(const {s,image,c,label}of views){const clip=s.clips[document.querySelector('#clip').value],frames=s.anims[clip].frames,total=frames.reduce((n,f)=>n+f.duration*1000,0);let time=elapsed%total,index=0;for(;index<frames.length-1;index++){if(time<frames[index].duration*1000)break;time-=frames[index].duration*1000;}const r=frames[index].data,scale=Math.min(2,110/s.anims.idle.frames[0].data.h);c.clearRect(0,0,200,160);c.imageSmoothingEnabled=false;c.drawImage(image,r.x,r.y,r.w,r.h,100-r.w*scale/2,140-r.h*scale,r.w*scale,r.h*scale);label.textContent=`${clip} · ${index+1} / ${frames.length}`;}requestAnimationFrame(draw);}requestAnimationFrame(draw);
</script></html>
