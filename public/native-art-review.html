<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Class Clash 0.2 · 원본 도트 검수</title><style>body{background:#18252e;color:#e5ebea;font:16px system-ui;margin:24px}a{color:#9bdad4}header{max-width:1100px;margin:auto}h1{font-size:26px}button,select{font:inherit;padding:10px;background:#30434e;color:white;border:1px solid #5a737f;border-radius:6px}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin:24px auto;max-width:1400px}article{background:#23343f;padding:15px;border-radius:8px;text-align:center}canvas{width:192px;height:192px;image-rendering:pixelated;background:#1b2b35}small{display:block;color:#99b2bc;margin:8px;word-break:break-all;font-size:11px}.warning{color:#f4ca8d}.controls{display:flex;gap:12px;flex-wrap:wrap}label{align-content:center}h2{font-size:18px}</style><header><a href="/">게임으로 돌아가기</a><h1>18종 원본 도트 · 데이터 기반 재생 검수</h1><p>LOL 맵 리워크의 챔피언 원본 PNG는 바꾸지 않았습니다. 이 화면은 같은 원본 프레임을 새 계약으로 재생합니다. 갤러리는 실제 경기 검증 영상과 구분합니다.</p><p class="warning">사용자 제공 자료 · 학교 교육용 로컬 사용 · 재배포 허가를 뜻하지 않습니다. 실제 그림은 좌우 미러이며 전·후면 8방향 그림을 새로 제작했다고 표시하지 않습니다.</p><div class="controls"><select id="state"><option value="idle">대기</option><option value="run">이동</option><option value="attack" selected>기본 공격</option><option value="skill1">스킬1</option><option value="skill2">스킬2</option><option value="hit">피격</option><option value="dead">사망</option></select><label><input type="checkbox" id="mirror">좌우 반전</label><button id="pause">일시 정지</button><button id="step">한 프레임</button><span id="status" role="status">불러오는 중…</span></div></header><main id="grid"></main><script type="module">
const manifest=await(await fetch('/assets/v2/manifest.json')).json(),cards=[];let paused=false,nowMs=0,last=0;
for(const[id,hero]of Object.entries(manifest.heroes)){const el=document.createElement('article'),title=document.createElement('h2'),canvas=document.createElement('canvas'),meta=document.createElement('small');canvas.width=192;canvas.height=192;title.textContent=hero.name+' · '+id;el.append(title,canvas,meta);document.querySelector('#grid').append(el);const image=new Image();image.src=hero.sheet;try{await image.decode();}catch(e){meta.textContent='필수 PNG 오류: '+hero.sheet;throw e;}cards.push({id,hero,canvas,meta,image});}
function draw(){for(const{hero,canvas,meta,image}of cards){const key=document.querySelector('#state').value,clip=hero.clips[key],frames=hero.anims[clip].frames,total=frames.reduce((n,f)=>n+f.duration*1000,0);let at=nowMs%total,index=0;for(;index<frames.length-1;index++){if(at<frames[index].duration*1000)break;at-=frames[index].duration*1000;}const f=frames[index],r=f.data,ctx=canvas.getContext('2d');ctx.clearRect(0,0,192,192);ctx.imageSmoothingEnabled=false;ctx.save();ctx.translate(96,170);ctx.scale(document.querySelector('#mirror').checked?-2:2,2);ctx.drawImage(image,r.x,r.y,r.w,r.h,-f.pivot[0],-f.pivot[1],r.w,r.h);ctx.restore();meta.textContent=clip+' · '+(index+1)+'/'+frames.length+' · release '+(hero.actions[key]?.releaseFrame??'—')+' · SHA '+hero.sourceHash.slice(0,12);}}
document.querySelector('#pause').onclick=()=>{paused=!paused;document.querySelector('#pause').textContent=paused?'재생':'일시 정지';};document.querySelector('#step').onclick=()=>{paused=true;nowMs+=80;draw();};document.querySelector('#state').onchange=()=>{nowMs=0;draw();};document.querySelector('#mirror').onchange=draw;document.querySelector('#status').textContent='18/18 PNG 로드 완료 · 원본 픽셀 보존';function loop(t){if(!paused)nowMs+=Math.min(100,t-last);last=t;draw();requestAnimationFrame(loop);}requestAnimationFrame(loop);window.__nativeArtReview={manifest,cards:cards.length};
</script></html>
