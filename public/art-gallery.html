<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Class Clash · 에셋 기반 동작 검수</title>
<style>*{box-sizing:border-box}body{margin:0;background:#101922;color:#edf2ee;font:15px/1.5 system-ui,sans-serif}header{padding:30px 5vw 20px;border-bottom:1px solid #34434c}header p{max-width:850px;color:#aebdbf}h1{font-size:28px;margin:0;color:#e8d497;letter-spacing:.08em}a{color:#9cdbdc}.controls{position:sticky;top:0;z-index:1;background:#172630f5;display:flex;flex-wrap:wrap;gap:18px;padding:16px 5vw;border-bottom:1px solid #3b5058;align-items:center}label{display:flex;gap:8px;align-items:center}select,button{background:#283b46;border:1px solid #587078;border-radius:6px;padding:8px 12px;color:#fff;font:inherit}button{cursor:pointer}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px;margin:25px 5vw}.hero{border:1px solid #334751;border-radius:10px;background:#192832;padding:14px;min-width:0}.hero h2{font-size:18px;margin:8px 0 3px}.hero code{color:#91bdc9;font-size:12px}.hero p{font-size:12px;color:#adbdbb;margin:6px 0}.stage{height:160px;display:flex;align-items:center;justify-content:center;background:linear-gradient(0deg,#263e36 0 25%,#1c302f 25% 26%,#15262c 26%);overflow:hidden;border-radius:6px}canvas{width:192px;height:192px;image-rendering:pixelated}.badge{font-size:11px;color:#f1d697}.locked{opacity:.45}.error{color:#ffaaa0}footer{padding:20px 5vw;color:#a1b3b5}</style>
<header><a href="/">← 게임으로</a><h1>CLASS CLASH / PIXEL STUDIO</h1><p>게임에서 사용하는 18명 에셋 기반 아틀라스의 시각 검수 화면입니다. 방향·몸 자세·무기 실루엣을 느린 재생으로 비교합니다. 전투 시뮬레이션이나 경기 녹화가 아니며, 실제 타격 시점과 피해는 게임 서버가 결정합니다.</p></header>
<div class="controls"><label>상태 <select id="state"><option value="idle">대기 · 2 자세</option><option value="walk">보행 · 4 자세</option><option value="basicAttack" selected>평타 · 6 자세</option><option value="skill1">스킬 1 · 6 자세</option><option value="skill2">스킬 2 · 8 자세</option><option value="hurt">피격 · 2 자세</option><option value="death">사망 · 5 자세</option><option value="spawn">등장 · 3 자세</option></select></label><label>방향 <select id="direction"><option>S</option><option>SE</option><option selected>E</option><option>NE</option><option>N</option><option>NW</option><option>W</option><option>SW</option></select></label><label>레벨 <select id="level"><option>1</option><option>2</option><option selected>5</option></select></label><label>느린 재생 <select id="speed"><option value="2">2 fps</option><option value="4" selected>4 fps</option><option value="8">8 fps</option></select></label><button id="pause">일시 정지</button><button id="next">한 프레임</button><span id="readout"></span></div><main id="grid"></main><footer id="status">아틀라스 로딩 중…</footer>
<script type="module">
const names=['성전사','검사','격투가','궁수','화염술사','얼음술사','사제','야만인','수도승','철갑기사','수호골렘','암살자','석궁병','번개술사','음유시인','룬 마법사','고대의 존재','수호령'];
const $=id=>document.getElementById(id);let manifest,items=[],running=true,frame=0,last=0;
try{const response=await fetch('/assets/heroes/manifest.json');if(!response.ok)throw new Error('manifest.json을 읽을 수 없습니다.');manifest=await response.json();
 await Promise.all(Object.entries(manifest.heroes).map(async([id,h],i)=>{const card=document.createElement('article');card.className='hero';card.innerHTML=`<div class="stage"><canvas width="64" height="64" aria-label="${names[i]} 도트 동작"></canvas></div><h2>${names[i]}</h2><code>${id}</code><p class="badge">${i<9?'일반':i<15?'고급':'전설'} · 발 피벗 32,52</p><p class="motion">64 × 64 셀 / 좌우 미러 / 8상태</p>`;$('grid').append(card);const img=new Image();img.src=h.image;await img.decode();const meta=await(await fetch(h.metadata)).json(),ctx=card.querySelector('canvas').getContext('2d');items.push({id,card,img,meta,ctx});const f=meta.animations.basicAttack.frames[0];ctx.imageSmoothingEnabled=false;ctx.drawImage(img,f.x,f.y,64,64,0,0,64,64);}));
 $('status').textContent=`에셋 PNG 18장 · 648 타임라인 자세 로딩 완료. 좌우는 같은 텍스처를 미러링합니다. 전투 검증: /battle-art-lab.html. 원본 출처: docs/ART_REFERENCE.md.`;
}catch(e){$('status').className='error';$('status').textContent='로딩 실패: '+e.message+' / npm run assets 실행 후 새로고침하세요.';throw e;}
function render(){const state=$('state').value,dir=$('direction').value,lev=+$('level').value,count=manifest.states[state].count;frame%=count;$('readout').textContent=`프레임 ${frame+1} / ${count}`;for(const it of items){const f=it.meta.animations[state].frames[frame],ctx=it.ctx;ctx.imageSmoothingEnabled=false;ctx.clearRect(0,0,64,64);ctx.save();if(['NW','W','SW'].includes(dir)){ctx.translate(64,0);ctx.scale(-1,1);}ctx.drawImage(it.img,f.x,f.y,64,64,0,0,64,64);ctx.restore();it.card.classList.toggle('locked',(state==='skill1'&&lev<2)||(state==='skill2'&&lev<5));it.card.querySelector('.motion').textContent=({idle:'대기',walk:'이동',basicAttack:'준비·타격·회수',skill1:'스킬 1',skill2:'스킬 2',hurt:'피격',death:'사망',spawn:'등장'})[state]+' · '+dir+' · '+(state==='skill1'&&lev<2||state==='skill2'&&lev<5?'아직 잠긴 스킬':'에셋 기반 프레임');}}
$('pause').onclick=()=>{running=!running;$('pause').textContent=running?'일시 정지':'재생';};$('next').onclick=()=>{running=false;$('pause').textContent='재생';frame++;render();};for(const id of ['state','direction','level'])$(id).onchange=()=>{frame=0;render();};
function loop(t){if(running&&t-last>1000/+$('speed').value){last=t;frame++;render();}requestAnimationFrame(loop);}render();requestAnimationFrame(loop);
</script></html>
